[package]
name = "fdbexporter"
version = "0.1.0"
edition = "2021"
authors = [ "Alexandre Burgoni <alexandre.burgoni@clever-cloud.com>" ]
description = "A monitoring tool for FoundationDB with exporting capabilities for prometheus"
keywords = ["foundationdb", "monitoring", "metrics", "exporter"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "fdbexporter"
path = "src/lib.rs"

[[bin]]
name = "fdbexporter"
path = "src/main.rs"
required-features = ["binary"]

[features]
default = ["binary", "fdb", "fdb-7_3"]
# The exporter executable. It polls FoundationDB, so it implies `fdb`.
binary = [
    "fdb",
    "dep:tokio",
    "dep:hyper",
    "dep:hyper-util",
    "dep:clap",
    "dep:tracing-subscriber",
    "dep:http-body-util",
    "dep:bytes",
]
# `fdb` gates the native FoundationDB client (fdb-rs) and the fetcher
# (`fetch_cluster_status`). Without it the library only provides the status
# models, `parse_status` and the Prometheus metrics, and no foundationdb crate
# is in the dependency graph. The version features and `binary` imply it.
# `fdb` alone, without a version feature, is rejected by fdb-rs itself: this is
# expected, enable exactly one of the version features below.
fdb = ["dep:foundationdb"]
# FoundationDB API version, mutually exclusive (checked in build.rs).
fdb-7_1 = ["fdb", "foundationdb/fdb-7_1"]
fdb-7_3 = ["fdb", "foundationdb/fdb-7_3"]

[dependencies]
# Core library dependencies (always available)
prometheus = "0.13.3"
tracing = "0.1"
anyhow = "^1.0.76"
serde_json = "1.0"
serde = { version = "1.0", features = ["serde_derive", "std"]}
serde_path_to_error = "0.1"
lazy_static = "1.4.0"
url = {version = "2.5.8", features = ["serde"]}

# Native FoundationDB client (only with "fdb" feature). Keep
# `default-features = false`: foundationdb's defaults also enable `recipes`.
foundationdb = { version = "0.11.0", features = ["embedded-fdb-include"], default-features = false, optional = true }

# Binary-specific dependencies (only with "binary" feature)
tokio = { version = "1.35.0", features = ["macros", "rt-multi-thread", "signal", "time"], optional = true }
hyper = { version = "1.1.0", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["full"], optional = true }
clap = { version = "4.4.11", features = ["derive", "env"], optional = true }
tracing-subscriber = { version = "0.3", optional = true }
http-body-util = { version = "0.1.0", optional = true }
bytes = { version = "1.5.0", optional = true }
