on: [push, pull_request]

name: Continuous integration

# No global RUSTFLAGS on purpose: the clippy jobs run with `-D warnings` and
# must see the unused-import / dead-code warnings that feature gating can
# introduce.

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: check

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - name: Setup FoundationDB
        uses: foundationdb-rs/foundationdb-actions-install@v2.3.0
        with:
          version: "7.3.43"
      - uses: actions-rs/cargo@v1
        with:
          command: test

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - run: rustup component add rustfmt
      - uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - run: rustup component add clippy
      - uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # Feature-gated modes.
  #
  # None of the jobs below install FoundationDB, and none of them should:
  #   - "no fdb" is the parser-only library (`--no-default-features`): the
  #     `foundationdb` crate is not in the dependency graph at all, and these
  #     jobs prove that the mode builds, lints and tests without the native
  #     client. Do not add a "Setup FoundationDB" step to them.
  #   - "binary, fdb-7_1" only type-checks the 7.1 client path: `cargo check`
  #     never links, and the C headers come from foundationdb's
  #     `embedded-fdb-include` feature.
  #   - "lib, fdb-7_3 and fdb-7_1" lints the library-only full mode the README
  #     documents (`default-features = false, features = ["fdb-7_3"]`): the
  #     `fdb` code without `binary`. Every other job that builds this code also
  #     enables `binary`, whose optional dependencies (tokio, bytes, ...) are
  #     then usable from the library too, so a `#[cfg(feature = "fdb")]` path
  #     that starts using one of them passes those jobs and only fails here.
  #     Clippy does not link either.
  # Every command is runnable as-is from the repository root.
  # ---------------------------------------------------------------------------

  check-no-fdb:
    name: Check (no fdb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - run: cargo check --lib --tests --no-default-features

  test-no-fdb:
    name: Test Suite (no fdb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - run: cargo test --no-default-features

  clippy-no-fdb:
    name: Clippy (no fdb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - run: rustup component add clippy
      - run: cargo clippy --all-targets --no-default-features -- -D warnings

  check-fdb-7_1:
    name: Check (binary, fdb-7_1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - run: cargo check --no-default-features --features binary,fdb-7_1

  clippy-lib-fdb:
    name: Clippy (lib, fdb-7_3 and fdb-7_1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - run: rustup component add clippy
      - run: cargo clippy --lib --tests --no-default-features --features fdb-7_3 -- -D warnings
      - run: cargo clippy --lib --tests --no-default-features --features fdb-7_1 -- -D warnings
